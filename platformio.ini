; ESP32 board-app template — one codebase, many boards, selected by build flags.
; Each env sets APP_BOARD_<NAME> (picks display/pins/button in board.h) + flash size
; + partition table. Add a board by copying an env block and filling in board.h.
; `s3-headless` is the simplest (null display) and builds anywhere.
[platformio]
default_envs = s3-headless

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    h2zero/NimBLE-Arduino@^2.3.7
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1

; ---- Generic headless S3 (no display / no button) — simplest starting point --------
[env:s3-headless]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions-8m.csv
build_flags = ${env.build_flags} -DAPP_BOARD_HEADLESS
    -DARDUINO_USB_MODE=1            ; hardware CDC/JTAG: auto-reset works on a buttonless board + serial
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0

; ---- LilyGo T-Embed CC1101 (S3, 16MB, ST7789 320x170, encoder button) --------------
[env:tembed-cc1101]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-16m.csv
build_flags = ${env.build_flags} -DAPP_BOARD_TEMBED
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0

; ---- LilyGo T-Dongle S3 (S3, 16MB, ST7735S 80x160, one button) ----------------------
[env:tdongle-s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-16m.csv
build_flags = ${env.build_flags} -DAPP_BOARD_TDONGLE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0

; ---- M5Cardputer ADV (StampS3, 8MB, ST7789 135x240) — board MUST be stamps3 ---------
[env:cardputer]
board = m5stack-stamps3            ; esp32-s3-devkitc-1 BOOTLOOPS on a StampS3
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions-8m.csv
build_flags = ${env.build_flags} -DAPP_BOARD_CARDPUTER
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0

; ---- LilyGo T-Display C5 (ESP32-C5, 16MB) — HEADLESS for now ------------------------
[env:tdisplay-c5]
board = esp32-c5-devkitc-1
board_build.mcu = esp32c5
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-16m.csv
upload_speed = 115200
upload_flags = --no-stub           ; the C5 ROM rejects the stub loader
build_flags = ${env.build_flags} -DAPP_BOARD_TDISPLAY_C5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0

; ---- Waveshare ESP32-C5-LCD-1.47 (ESP32-C5, 4MB) — HEADLESS for now -----------------
[env:waveshare-c5]
board = esp32-c5-devkitc-1
board_build.mcu = esp32c5
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions-c5-4m.csv
upload_speed = 115200
upload_flags = --no-stub
build_flags = ${env.build_flags} -DAPP_BOARD_WAVESHARE_C5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
